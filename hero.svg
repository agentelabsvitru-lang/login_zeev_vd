<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Rótulo -->
  <rect x="0" y="12" width="28" height="2" fill="#F5C400"/>
  <text x="40" y="18" font-size="13" font-weight="600" letter-spacing="1.6" fill="#F5C400">PORTAL DE ATENDIMENTO - ZEEV</text>

  <!-- Título -->
  <text font-size="50" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="0" y="96">Solicite, acompanhe e</tspan>
    <tspan x="0" y="158">atenda <tspan fill="#F5C400">em um só lugar</tspan></tspan>
  </text>

  <!-- Subtítulo -->
  <text x="0" y="222" font-size="18" font-weight="700" fill="#FFFFFF">Novo ambiente de solicitações de protocolos da Vitru.</text>

  <!-- Descrição -->
  <text font-size="17" fill="#FFFFFF" fill-opacity=".78">
    <tspan x="0" y="256">Registre protocolos e acompanhe prazos de cada etapa em uma única</tspan>
    <tspan x="0" y="282">ferramenta.</tspan>
  </text>

  <!-- Marcas atendidas -->
  <text x="0" y="336" font-size="13" fill="#FFFFFF" fill-opacity=".6">Atende</text>
  <g font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="58" y="314" width="128" height="32" rx="16" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="122" y="335">Vitru Educação</text>
    <rect x="196" y="314" width="114" height="32" rx="16" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="253" y="335">Unicesumar</text>
    <rect x="320" y="314" width="96" height="32" rx="16" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="368" y="335">Uniasselvi</text>
    <rect x="426" y="314" width="108" height="32" rx="16" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="480" y="335">Rede Enem</text>
  </g>
</svg>
